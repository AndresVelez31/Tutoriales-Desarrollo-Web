services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-bookstore}
      MYSQL_USER: ${DB_USER:-bookstore}
      MYSQL_PASSWORD: ${DB_PASSWORD:-bookstore}
    # Only reachable from this machine (useful for local development), never from the internet
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # Ping over TCP: during first-time init MySQL only listens on its socket, so this waits for the real server
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-bookstore}
      DB_USER: ${DB_USER:-bookstore}
      DB_PASSWORD: ${DB_PASSWORD:-bookstore}
    depends_on:
      mysql:
        condition: service_healthy
    # No public port: the frontend's nginx proxies /api to backend:3000 inside the Docker network

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql-data:
